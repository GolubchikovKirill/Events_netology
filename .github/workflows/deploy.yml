name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - video

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: events/yarn.lock

      - name: Install dependencies
        run: yarn install
        working-directory: ./events

      - name: Build project
        run: yarn build
        working-directory: ./events

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./events/dist
